<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="The Cascade — A weekly almanac">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.86  0 0 0 0 0.82  0 0 0 0 0.74  0 0 0 0.05 0"/>
      <feComposite in="SourceGraphic" operator="over"/>
    </filter>
    <pattern id="dot" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="0.5" cy="0.5" r="0.5" fill="#1A1612" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Paper -->
  <rect width="1200" height="630" fill="#F4EFE6"/>
  <rect width="1200" height="630" fill="url(#dot)"/>

  <!-- Top kicker rule -->
  <line x1="80" y1="80" x2="1120" y2="80" stroke="#E8E1D1" stroke-width="1"/>

  <!-- Eyebrow -->
  <text x="80" y="140"
        font-family="'IM Fell DW Pica SC', 'IBM Plex Mono', Menlo, monospace"
        font-size="22"
        letter-spacing="6"
        fill="#C8431C">A WEEKLY ALMANAC</text>

  <!-- Title -->
  <text x="80" y="290"
        font-family="'Fraunces', 'Iowan Old Style', Georgia, serif"
        font-size="180"
        font-weight="500"
        fill="#1A1612">The Cascade</text>

  <!-- Strapline -->
  <text x="80" y="370"
        font-family="'Fraunces', Georgia, serif"
        font-size="38"
        font-style="italic"
        font-weight="400"
        fill="#1A1612">Eight chapters. Twenty-three measures.</text>
  <text x="80" y="416"
        font-family="'Fraunces', Georgia, serif"
        font-size="38"
        font-style="italic"
        font-weight="400"
        fill="#1A1612">The shape of the world this week.</text>

  <!-- Vermilion diamond ornament + URL -->
  <g transform="translate(80, 540)">
    <path d="M0 -10 L18 0 L0 10 L-18 0 Z" fill="none" stroke="#C8431C" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="2.5" fill="#C8431C"/>
  </g>
  <text x="120" y="548"
        font-family="'IM Fell DW Pica SC', 'IBM Plex Mono', Menlo, monospace"
        font-size="22"
        letter-spacing="3"
        fill="#1A1612">cascade-simulator.pages.dev</text>

  <!-- Right-side clock face: subtle radial almanac glyph -->
  <g transform="translate(960, 290)" stroke="#C8431C" fill="none">
    <!-- Outer ring -->
    <circle r="180" stroke-width="1" stroke-opacity="0.3"/>
    <!-- Inner ring -->
    <circle r="140" stroke-width="1" stroke-opacity="0.5"/>
    <!-- Hour ticks (12) -->
    <g stroke-width="1.2">
      <line x1="0" y1="-180" x2="0" y2="-160"/>
      <line x1="90" y1="-156" x2="80" y2="-138" transform="rotate(30)"/>
      <line x1="156" y1="-90" x2="138" y2="-80" transform="rotate(60)"/>
      <line x1="180" y1="0" x2="160" y2="0"/>
      <line x1="156" y1="90" x2="138" y2="80" transform="rotate(120)"/>
      <line x1="90" y1="156" x2="80" y2="138" transform="rotate(150)"/>
      <line x1="0" y1="180" x2="0" y2="160"/>
      <line x1="-90" y1="156" x2="-80" y2="138" transform="rotate(210)"/>
      <line x1="-156" y1="90" x2="-138" y2="80" transform="rotate(240)"/>
      <line x1="-180" y1="0" x2="-160" y2="0"/>
      <line x1="-156" y1="-90" x2="-138" y2="-80" transform="rotate(300)"/>
      <line x1="-90" y1="-156" x2="-80" y2="-138" transform="rotate(330)"/>
    </g>
    <!-- Minute hand pointing to ~11:55 (close to midnight) -->
    <line x1="0" y1="0" x2="0" y2="-130" stroke-width="2.4" stroke-linecap="round"/>
    <!-- Hour hand -->
    <line x1="0" y1="0" x2="-30" y2="-70" stroke-width="3.2" stroke-linecap="round"/>
    <!-- Centre cap -->
    <circle r="6" fill="#C8431C" stroke="none"/>
    <!-- Diamond at 12 -->
    <path d="M0 -200 L10 -190 L0 -180 L-10 -190 Z" fill="#C8431C" stroke="none"/>
  </g>
</svg>
